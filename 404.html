<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>renmygames.com へ</title>
<script>
// github.io で 見つからない ページ（非公開にした ゲーム）は renmygames.com の 同じ 場所へ（記録は 運ばない）
if (/\.github\.io$/.test(location.hostname)) location.replace('https://renmygames.com' + location.pathname + location.search + location.hash);
</script>
</head><body style="font-family:sans-serif;text-align:center;padding:40px 16px">
<p>ゲームは <a href="https://renmygames.com/">renmygames.com</a> に ひっこしました。</p>
</body></html>
